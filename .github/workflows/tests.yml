name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q src tests *.py
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Safe integrated demonstrations and evaluation tools
        run: python scripts/verify_integration.py --summary /tmp/integration-summary.json
        env:
          PYTHONPATH: src
      - name: Validate monitoring configuration
        run: |
          if GRAFANA_ADMIN_USER= GRAFANA_ADMIN_PASSWORD= docker compose -f monitoring/docker-compose.yml config --quiet 2>/dev/null; then
            echo 'Compose accepted missing credentials'
            exit 1
          fi
          GRAFANA_ADMIN_USER=ci-user GRAFANA_ADMIN_PASSWORD=ci-only-placeholder docker compose -f monitoring/docker-compose.yml config --quiet
